server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets are immutable; mirrors the CloudFront cache policy.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must always revalidate, or a deploy is invisible to returning
    # visitors holding a cached shell.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # API path-routed under the same origin as the SPA. This is the local
    # equivalent of the CloudFront /api/* behavior, and it is what allows the
    # session cookie to stay SameSite=Lax (ADR-001). The prefix is NOT stripped:
    # the API owns the /api namespace itself.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Same-origin health probe. The API serves /health outside the /api
    # namespace because the ALB target group checks it directly (CLAUDE.md).
    location = /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
    }

    # SPA routing: unknown paths are client-side routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
