# Ruff configuration for the backend service.
#
# Scoped to `backend/` rather than the repo root so that `infra/` (CDK) can
# adopt its own rule set independently.
#
# The rule set is a deliberate baseline: pycodestyle errors and warnings plus
# the full pyflakes set. That is the set that catches genuine defects — undefined
# names, unused imports, shadowed bindings, broken syntax — without imposing a
# reformat on code that is already written and reviewed. Opinionated families
# (isort `I`, pyupgrade `UP`, bugbear `B`) are deliberately left off: enabling
# them today would fail CI on existing, intentional code (the `%d`-built regex
# in app/middleware.py, the quoted `-> "Settings"` annotation in app/settings.py)
# for no correctness gain. They can be turned on in a dedicated change that
# also fixes what they flag.

target-version = "py312"

# Matches the widest line in the existing sources; nothing here needs rewrapping.
line-length = 88

[lint]
select = ["E", "W", "F"]
